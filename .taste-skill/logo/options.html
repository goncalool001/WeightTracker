<!doctype html>
<html><head><meta charset="utf-8"><title>Logo options</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:"Instrument Sans",sans-serif;background:#ebebe6;color:#1f201d}
  .row{display:flex;gap:28px;align-items:center;padding:22px 32px;border-bottom:1px solid #dcdcd6}
  .row.dark{background:#111110;color:#f1f1ee;border-color:#2a2a28}
  h2{font-size:15px;width:190px;margin:0;font-weight:600}
  .lock{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px}
  svg{display:block}
</style></head><body>
<script>
const T={A:`<rect width="512" height="512" rx="128" fill="var(--bg)"/>
  <path d="M104 316 C 190 316, 214 214, 296 226 S 380 196, 408 176" fill="none" stroke="#5cb8ad" stroke-width="44" stroke-linecap="round"/>
  <circle cx="176" cy="226" r="34" fill="var(--fg)"/>
  <circle cx="262" cy="320" r="34" fill="var(--fg)"/>
  <circle cx="350" cy="292" r="34" fill="var(--fg)"/>`,B:`<rect width="512" height="512" rx="128" fill="var(--bg)"/>
  <rect x="96" y="242" width="320" height="28" rx="14" fill="var(--fg)" fill-opacity=".22"/>
  <rect x="96" y="242" width="214" height="28" rx="14" fill="#5cb8ad"/>
  <rect x="296" y="170" width="28" height="172" rx="14" fill="var(--fg)"/>
  <rect x="392" y="214" width="16" height="84" rx="8" fill="var(--fg)" fill-opacity=".55"/>`,C:`<rect width="512" height="512" rx="128" fill="var(--bg)"/>
  <polyline points="104,170 180,338 256,226 332,338 408,170" fill="none" stroke="var(--fg)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="408" cy="170" r="40" fill="#5cb8ad"/>`};
  const opts=[['A','A · Pesagens e média'],['B','B · Régua até à meta'],['C','C · W de traço']];
  const sizes=[128,48,32,16];
  for (const theme of ['light','dark']) for (const [id,name] of opts){
    const bg= theme==='light' ? '#1f201d' : '#f1f1ee', fg= theme==='light' ? '#ffffff' : '#1f201d';
    const inner=T[id].replaceAll('var(--bg)',bg).replaceAll('var(--fg)',fg);
    const svg=s=>`<svg width="${s}" height="${s}" viewBox="0 0 512 512">${inner}</svg>`;
    const row=document.createElement('div'); row.className='row '+theme;
    row.innerHTML=`<h2>${name}${theme==='dark'?' (escuro)':''}</h2>`+sizes.map(svg).join('')+`<div class="lock">${svg(28)}Weight Tracker</div>`;
    document.body.appendChild(row);
  }
</script>
</body></html>

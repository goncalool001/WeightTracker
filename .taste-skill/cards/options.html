<!doctype html>
<html lang="pt" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opções de cartões</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ground:#ebebe6;--surface:#fff;--active:#e6e6e1;--border:#dcdcd6;--rule:#ecece8;--text:#1f201d;--muted:#5e5e5b;--accent:#1b6e66;--accent-soft:#e2efed;--positive:#2e7d32;--negative:#b42318}
  .dark{--ground:#111110;--surface:#1a1a19;--active:#2a2a28;--border:#2c2c2a;--rule:#222220;--text:#ededea;--muted:#b4b4b0;--accent:#5cb8ad;--accent-soft:#1d3532;--positive:#5fc77f;--negative:#ff8a7a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--text);font:15px/1.5 "Instrument Sans",system-ui,sans-serif;padding:24px 32px 64px}
  .num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .unit{color:var(--muted);font-size:.8em;margin-left:.15em}
  .pos{color:var(--positive)} .neg{color:var(--negative)}
  .arrow{font-size:.7em;margin-right:.25em}
  header.top{display:flex;justify-content:space-between;align-items:center;max-width:1440px;margin-bottom:8px}
  button{font:inherit;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 14px;cursor:pointer}
  section.opt{margin-top:36px}
  section.opt h2{font-size:20px;margin:0 0 2px}
  section.opt p.why{margin:0 0 14px;color:var(--muted);max-width:80ch}
  .stage{display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap}
  .desk{width:1100px}
  .phone{width:343px}
  .tag{font-size:12px;color:var(--muted);margin-bottom:6px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:22px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .phone .grid4{grid-template-columns:1fr 1fr;gap:12px}
  .card{padding:16px;display:flex;flex-direction:column;gap:4px;min-height:128px}
  .phone .card{min-height:0}
  .lbl{font-size:14px;color:var(--muted)}
  .big{font-size:24px;line-height:1.15}
  .phone .big{font-size:22px}
  .cap{font-size:13px;color:var(--muted);margin-top:auto}
  .cap b{font-weight:500;color:var(--text)}
  .bar{height:6px;border-radius:99px;background:var(--active);position:relative;overflow:hidden;margin-top:8px}
  .bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
  /* B */
  .gridB{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:16px}
  .phone .gridB{grid-template-columns:1fr 1fr 1fr;gap:12px}
  .phone .gridB .hero{grid-column:1/-1}
  .hero .huge{font-size:40px;line-height:1.05}
  .phone .hero .huge{font-size:34px}
  .phone .gridB .card:not(.hero){padding:12px}
  .phone .gridB .card:not(.hero) .big{font-size:18px}
  .phone .gridB .card:not(.hero) .lbl{font-size:13px}
  /* C */
  .strip{display:grid;grid-template-columns:repeat(4,1fr)}
  .strip>div{padding:18px 20px;border-left:1px solid var(--rule);display:flex;flex-direction:column;gap:4px}
  .strip>div:first-child{border-left:0}
  .phone .strip{grid-template-columns:1fr 1fr}
  .phone .strip>div{padding:14px 16px}
  .phone .strip>div:nth-child(3){border-left:0}
  .phone .strip>div:nth-child(n+3){border-top:1px solid var(--rule)}
  .foot{border-top:1px solid var(--rule);padding:12px 20px 16px;display:flex;gap:12px;align-items:center;font-size:13px;color:var(--muted)}
  .foot .bar{flex:1;margin:0}
  /* D */
  .pair{display:flex;gap:14px;align-items:flex-end;margin-top:2px}
  .pair .wk{display:flex;flex-direction:column}
  .pair .wk small{font-size:12px;color:var(--muted)}
  .pair .now{font-size:24px;line-height:1.15}
  .pair .was{font-size:17px;color:var(--muted)}
  .phone .pair .now{font-size:22px}
</style>
</head>
<body>
<header class="top">
  <div><strong>Cartões do ecrã Hoje — opções</strong><br><span style="color:var(--muted)">Os teus dados de 27 out: 75.7 hoje · semana 26–27 out média 75.8 · semana passada 76.7 · início 86.1 a 18 abr · meta 75</span></div>
  <button onclick="document.documentElement.classList.toggle('dark')">Claro / escuro</button>
</header>
<div id="root"></div>

<script>
const D = {
  last: '75.7', lastWhen: 'hoje, 27 out',
  week: '75.8', weekN: '2 pesagens desde seg 26 out', prevWeek: '76.7', delta: '−0.9',
  total: '−10.4', start: '86.1', startDate: '18 abr',
  goal: '75', left: '0.7', pct: 94, eta: '5–10 nov', pace: '−0.46',
};
const kg = (v) => `<span class="num">${v}<span class="unit">kg</span></span>`;
const down = (v, unit='kg') => `<span class="num pos"><span class="arrow">▼</span>${v}<span class="unit" style="color:inherit">${unit}</span></span>`;

const A = () => `
<div class="grid4">
  <div class="panel card"><div class="lbl">Última pesagem</div><div class="big">${kg(D.last)}</div><div class="cap">${D.lastWhen}</div></div>
  <div class="panel card"><div class="lbl">Média esta semana</div><div class="big">${kg(D.week)}</div><div class="cap">${down(D.delta)} face aos <b class="num">${D.prevWeek}</b> da semana passada</div></div>
  <div class="panel card"><div class="lbl">Total perdido</div><div class="big">${down(D.total)}</div><div class="cap">desde ${D.start} kg a ${D.startDate}</div></div>
  <div class="panel card"><div class="lbl">Meta ${D.goal} kg</div><div class="big">${kg(D.left)} <span style="font-size:15px;color:var(--muted)">em falta</span></div><div class="cap">chegada prevista <b>${D.eta}</b></div></div>
</div>`;

const B = () => `
<div class="gridB">
  <div class="panel card hero">
    <div class="lbl">Última pesagem · ${D.lastWhen}</div>
    <div class="huge">${kg(D.last)}</div>
    <div style="font-size:15px">${down(D.total)} <span style="color:var(--muted)">desde ${D.start} kg a ${D.startDate}</span></div>
    <div class="bar" aria-hidden="true"><i style="width:${D.pct}%"></i></div>
    <div class="cap" style="display:flex;justify-content:space-between"><span>${D.start}</span><span>${D.pct}% · meta ${D.goal}</span></div>
  </div>
  <div class="panel card"><div class="lbl">Esta semana</div><div class="big">${kg(D.week)}</div><div class="cap">${down(D.delta)} vs ${D.prevWeek}</div></div>
  <div class="panel card"><div class="lbl">Falta</div><div class="big">${kg(D.left)}</div><div class="cap">até ${D.goal} kg</div></div>
  <div class="panel card"><div class="lbl">Chegada</div><div class="big num">${D.eta}</div><div class="cap">${down(D.pace,'kg/sem')}</div></div>
</div>`;

const C = () => `
<div class="panel">
  <div class="strip">
    <div><div class="lbl">Última pesagem</div><div class="big">${kg(D.last)}</div><div class="cap">${D.lastWhen}</div></div>
    <div><div class="lbl">Esta semana</div><div class="big">${kg(D.week)}</div><div class="cap">${down(D.delta)} vs semana passada</div></div>
    <div><div class="lbl">Total perdido</div><div class="big">${down(D.total)}</div><div class="cap">desde ${D.startDate}</div></div>
    <div><div class="lbl">Chegada à meta</div><div class="big num">${D.eta}</div><div class="cap">faltam ${D.left} kg</div></div>
  </div>
  <div class="foot"><span class="num">${D.start}</span><div class="bar" aria-hidden="true"><i style="width:${D.pct}%"></i></div><span class="num">${D.goal} kg · ${D.pct}%</span></div>
</div>`;

const Dd = () => `
<div class="grid4">
  <div class="panel card">
    <div class="lbl">Semana a semana</div>
    <div class="pair">
      <div class="wk"><small>esta</small><span class="now">${kg(D.week)}</span></div>
      <div class="wk"><small>passada</small><span class="was num">${D.prevWeek}</span></div>
    </div>
    <div class="cap">${down(D.delta)} · ${D.weekN}</div>
  </div>
  <div class="panel card"><div class="lbl">Última pesagem</div><div class="big">${kg(D.last)}</div><div class="cap">${D.lastWhen}</div></div>
  <div class="panel card"><div class="lbl">Total perdido</div><div class="big">${down(D.total)}</div><div class="cap">desde ${D.start} kg a ${D.startDate}</div></div>
  <div class="panel card"><div class="lbl">Chegada à meta</div><div class="big num">${D.eta}</div><div class="cap">faltam <b class="num">${D.left} kg</b> · ${down(D.pace,'kg/sem')}</div></div>
</div>`;

const opts = [
  ['A · Quatro respostas', 'Quatro cartões do mesmo tamanho, cada um responde a uma pergunta com um número e um contexto: quanto peso hoje, como vai a semana, quanto já perdi, quando chego. A meta junta o "falta" e a data num só cartão.', A],
  ['B · Destaque + três', 'A última pesagem em grande, com o total perdido e a barra até à meta no mesmo cartão. Os outros três ficam pequenos. Hierarquia mais forte; o cartão "Caminho até à meta" por baixo fica em parte redundante (podia encolher para só a faixa dos 30 dias).', B],
  ['C · Painel único', 'Sem quatro cartões: uma só faixa com quatro colunas separadas por linhas e a barra de progresso no rodapé. Menos moldura, lê-se como uma linha de resumo.', C],
  ['D · Semana em foco', 'Igual à A, mas o primeiro cartão põe as duas semanas lado a lado (75.8 contra 76.7), para veres de onde vem o −0.9. O cartão da meta junta data, quilos em falta e ritmo.', Dd],
];
document.getElementById('root').innerHTML = opts.map(([t, why, f]) => `
<section class="opt">
  <h2>${t}</h2><p class="why">${why}</p>
  <div class="stage">
    <div class="desk"><div class="tag">Desktop (1100 px)</div>${f()}</div>
    <div class="phone"><div class="tag">Telemóvel (375 px)</div>${f()}</div>
  </div>
</section>`).join('');
</script>
</body>
</html>
